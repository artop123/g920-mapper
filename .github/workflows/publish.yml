name: .NET Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        tags: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Lint the code
      run: dotnet format --verify-no-changes

    - name: Determine version
      id: version
      run: |
        TAG="$GITHUB_REF_NAME"

        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Tag '$TAG' must use the format vMAJOR.MINOR.PATCH."
          exit 1
        fi

        VERSION=${TAG#v}
        echo "Publishing version $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the project
      run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

    - name: Run tests
      run: dotnet test --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }}
      
    - name: Publish the project
      run: dotnet publish g920-mapper/g920-mapper.csproj -p:PublishProfile=Release /p:Version=${{ steps.version.outputs.version }}
      
    - name: Remove PDB files
      run: find ./g920-mapper/publish -name "*.pdb" -type f -delete

    - name: Compress the publish directory
      run: cd g920-mapper/publish && zip -r G920WheelApp.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: G920WheelApp
        path: ./g920-mapper/publish/G920WheelApp.zip

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Release v${{ steps.version.outputs.version }}
        body: "${{ github.event.head_commit.message }}"
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./g920-mapper/publish/G920WheelApp.zip
        asset_name: G920WheelApp.zip
        asset_content_type: application/zip
